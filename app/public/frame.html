<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Frame content</title><link rel="stylesheet" href="/style.css"></head>
<body>
<form id="newsletter-form">
<label for="newsletter-email">Newsletter email</label>
<input type="email" id="newsletter-email">
<button type="submit">Subscribe</button>
</form>
<p id="newsletter-msg" class="success"></p>
<script>
document.getElementById("newsletter-form").addEventListener("submit", function (e) {
  e.preventDefault();
  document.getElementById("newsletter-msg").textContent = "Subscribed: " + document.getElementById("newsletter-email").value;
});
</script>
</body>
</html>
